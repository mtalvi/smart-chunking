# Pattern configuration for Ansible log analysis
# This file defines the patterns used for error detection

# Ansible-specific error patterns
ansible_patterns:
  # Fatal errors - Updated based on real log analysis
  fatal_patterns:
    - "fatal:"
    - "FATAL:"
    - "Fatal:"
    - "fatal: [.*]: FAILED!"
    - "fatal: [.*]: UNREACHABLE!"
    
  # Failed task patterns - Enhanced with real patterns
  failed_patterns:
    - "failed:"
    - "FAILED:"
    - "Failed:"
    - "...failed"
    - "task failed"
    - "playbook failed"
    - "FAILED - RETRYING:"
    - "FAILED!"
    
  # Error patterns
  error_patterns:
    - "error:"
    - "ERROR:"
    - "Error:"
    - "errors:"
    - "ERRORS:"
    
  # Unreachable host patterns - Enhanced
  unreachable_patterns:
    - "unreachable:"
    - "UNREACHABLE:"
    - "Unreachable:"
    - "...unreachable"
    - "host unreachable"
    - "connection failed"
    - "UNREACHABLE!"
    - "Failed to connect to the host"
    
  # Exception patterns
  exception_patterns:
    - "exception:"
    - "Exception:"
    - "EXCEPTION:"
    - "traceback"
    - "Traceback"
  
  # Infrastructure retry patterns - NEW: Always detect retries for operational visibility
  infrastructure_retry_patterns:
    - "FAILED - RETRYING:.*EC2.*instances.*running"
    - "FAILED - RETRYING:.*Wait until.*EC2"
    - "FAILED - RETRYING:.*instances.*running.*retries left"
    - "FAILED - RETRYING:.*infrastructure"
    - "FAILED - RETRYING:.*timeout"
    - "FAILED - RETRYING:.*connection"
    - "FAILED - RETRYING:"  # General pattern to catch all retries
  
  # Infrastructure correlation patterns - NEW: Advanced detection
  infrastructure_patterns:
    # EC2 instance lifecycle patterns
    - "stopped.*name.*stopped"
    - "Ensure EC2 instances are running"
    - "changed:.*item.*state.*stopped"
    - "Wait until all EC2 instances are running"
    
  # Boot sequence patterns - NEW: System boot detection
  boot_sequence_patterns:
    - "System is booting up"
    - "Unprivileged users are not permitted to log in yet"
    - "Please come back later"
    - "System is starting up"
    - "boot.*in.*progress"
    
  # SSH provisioning patterns - NEW: Key provisioning issues
  ssh_provisioning_patterns:
    - "no such identity:"
    - "ssh_provision_.*: No such file or directory"
    - "Permission denied.*publickey"
    - "Host key verification failed"
    - "Could not resolve hostname"
    
  # Critical path dependency patterns - NEW: Impact assessment
  critical_dependency_patterns:
    - "bastion.*unreachable"
    - ".*unreachable=1.*"
    - "NO MORE HOSTS LEFT"
    - "All hosts unreachable"
    - "Control plane unreachable"
    - "TRACEBACK"
    
  # Failure patterns - Updated to exclude intentionally ignored failures
  failure_patterns:
    - "failure:"
    - "FAILURE:"
    - "Failure:"
    - "failed with return code"
    - "non-zero return code"
    - "NO MORE HOSTS LEFT"

  # Ansible execution termination patterns
  execution_termination:
    - "NO MORE HOSTS LEFT"
    - "PLAY RECAP.*failed=[1-9]"
    - "PLAY RECAP.*unreachable=[1-9]"
  
  # Ansible warning patterns
  warning_patterns:
    - "\\[WARNING\\]:"
    - "\\[DEPRECATION WARNING\\]:"
    - "Could not match supplied host pattern"
    - "key_name is DEPRECATED"
    - "ignoring"
    - "...ignoring"

# General programming error patterns
programming_patterns:
  # Python traceback patterns
  python_traceback:
    - "Traceback (most recent call last):"
    - "  File \""
    - "    "
    - "^[A-Za-z_][A-Za-z0-9_]*Error:"
    - "^[A-Za-z_][A-Za-z0-9_]*Exception:"
    
  # Java/JVM stack trace patterns
  java_stacktrace:
    - "Exception in thread"
    - "	at "
    - "Caused by:"
    - "java.lang."
    - ".java:"
    
  # Generic error indicators
  generic_errors:
    - "ERROR"
    - "CRITICAL"
    - "FATAL"
    - "FAIL"
    - "ABORT"
    - "PANIC"

# Regex patterns for more complex matching
regex_patterns:
  # Ansible-specific task status patterns
  ansible_task_status:
    - "fatal: \\[.*\\]: (FAILED|UNREACHABLE)!"
    - "FAILED - RETRYING: \\[.*\\]:"
    
  # Play recap patterns with actual failures
  play_recap_errors:
    - "PLAY RECAP.*failed=[1-9]\\d*"
    - "PLAY RECAP.*unreachable=[1-9]\\d*"
    - ".*failed=[1-9]\\d*.*unreachable=[1-9]\\d*"
    
  # Return code patterns
  return_codes:
    - "return code (?!0\\b)\\d+"
    - "exit status (?!0\\b)\\d+"
    - "exit code (?!0\\b)\\d+"
    
  # Connection error patterns - Enhanced based on real logs
  connection_errors:
    - "Connection (refused|timeout|reset|closed|failed)"
    - "(SSH|ssh).*(failed|error|refused|timeout)"
    - "(Timeout|timeout).*(connecting|connection)"
    - "Failed to connect to the host via ssh"
    
  # Assertion failures - From real logs
  assertion_failures:
    - '"assertion".*"evaluated_to": false'
    - 'assertion.*failed'

# Pattern weights for confidence scoring - Adjusted based on analysis
pattern_weights:
  fatal_patterns: 0.95
  failed_patterns: 0.80  # Reduced because of RETRYING patterns
  error_patterns: 0.75
  unreachable_patterns: 0.95
  exception_patterns: 0.85
  failure_patterns: 0.85
  execution_termination: 0.98  # Very high confidence
  python_traceback: 0.90
  java_stacktrace: 0.85
  generic_errors: 0.60  # Reduced to avoid false positives
  ansible_task_status: 0.95
  play_recap_errors: 0.98
  return_codes: 0.80
  connection_errors: 0.90
  assertion_failures: 0.95
  warning_patterns: 0.75  # High enough to pass hybrid threshold
  deprecation_warnings: 0.75  # High enough to pass hybrid threshold
  # NEW: Advanced infrastructure correlation patterns
  infrastructure_patterns: 0.85  # High priority for infra issues
  infrastructure_retry_patterns: 0.95  # Very high priority - always detect retries
  boot_sequence_patterns: 0.90   # Very important for timing issues
  ssh_provisioning_patterns: 0.88 # High priority for auth failures
  critical_dependency_patterns: 0.98 # Highest priority for blocking issues

# Enhanced semantic similarity phrases based on real log analysis
semantic_phrases:
  error_phrases:
    - "task execution failed"
    - "playbook execution error"
    - "connection could not be established"
    - "authentication failed"
    - "permission denied"
    - "file not found"
    - "module not found"
    - "syntax error in playbook" 
    - "variable not defined"
    - "template rendering failed"
    - "host became unreachable"
    - "timeout waiting for response"
    - "certificate verification failed"
    - "package installation failed"
    - "service startup failed"
    - "configuration validation error"
    - "cluster admin must be created"
    - "assertion evaluation failed"
    - "ssh connection refused"
    - "host connection timeout"
    - "failed to connect via ssh"
    - "dependency resolution failed"
    - "package conflict detected"
    - "rosa installer completion failed"
    - "cloudformation template failed"
    - "terraform apply failed"
    
  # Infrastructure correlation failures - NEW: Advanced contextual detection
  infrastructure_correlation:
    - "instance restart causing connectivity issues"
    - "ec2 instances stopped then restarted"
    - "infrastructure lifecycle disruption"
    - "instance state transition failure"
    - "post restart connectivity failure"
  
  # Infrastructure retry intelligence - NEW: Operational visibility
  infrastructure_retry_intelligence:
    - "infrastructure retry attempts indicate performance issues"
    - "repeated retries suggest underlying infrastructure problems"
    - "retry patterns indicate resource provisioning delays"
    - "infrastructure timeout requiring retry strategy"
    - "infrastructure performance degradation detected"
    
  # Boot sequence intelligence - NEW: System startup context
  boot_sequence_intelligence:
    - "system still booting wait required"
    - "boot process incomplete retry needed"
    - "unprivileged access during boot"
    - "system initialization in progress"
    - "boot completion required for access"
    
  # SSH provisioning context - NEW: Key management failures
  ssh_provisioning_context:
    - "ssh key provisioning after restart"
    - "identity file missing post restart"
    - "key provisioning failure correlation"
    - "ssh authentication setup incomplete"
    - "provisioning key not found"
    
  # Critical path impact - NEW: Dependency failure assessment
  critical_path_impact:
    - "bastion unreachable blocks entire playbook"
    - "critical infrastructure dependency failed"
    - "control plane access lost"
    - "essential host unreachable"
    - "deployment blocked by infrastructure failure"

# Enhanced exclusion patterns based on real log analysis
exclusions:
  # Timing and execution flow (NOT ERRORS) - Enhanced to catch semantic false positives
  execution_flow:
    - ".*\\d+\\.\\d+s \\*+$"  # Task timing
    - ".*===+ \\d+\\.\\d+s$"  # Timing separators  
    - "TASKS RECAP \\*+"
    - "Friday.*\\d{4}.*\\+\\d{4}.*\\*+"  # Timestamp lines
    - "==============================================================================="
    # CRITICAL: Exclude timing summaries that semantic detector mistakes for errors
    - ".*---- \\d+\\.\\d+s$"    # "Launch CloudFormation template (local) ---- 158.02s"
    - ".*-{10,} \\d+\\.\\d+s$"  # Multiple dashes with timing
    - ".* : .* -{4,} \\d+\\.\\d+s$"  # Role-based timing summaries
    
  # Active operations (NOT FAILURES) - More lenient with retries
  active_operations:
    - "ok: \\[.*\\]"
    - "changed: \\[.*\\]"
    - "skipping: \\[.*\\]"
    - "included: .*"
    # Allow retries to be detected and aggregated, only exclude very fresh retries
    - "FAILED - RETRYING:.*\\(1[2-9][0-9]+ retries left\\)"  # 120+ retries (very fresh)
    
  # Task headers and descriptions (NOT ERRORS)
  task_metadata:
    - "^TASK \\[.*\\] \\*+$"  # All task headers
    - "^PLAY \\[.*\\] \\*+$"  # Play headers
    - "Run [a-zA-Z]+ [a-zA-Z]+"  # "Run terraform init"
    - "Wait for .* completion"   # "Wait for ROSA completion"
    - "Install .*"               # "Install Helm"
    - "Create .*"                # "Create SSH key"
    
  # Expected warnings that are still worth detecting (REMOVED most exclusions)
  expected_warnings:
    - "skipping installation of.*already installed"  # Only exclude routine installation skips
    
  # Success indicators
  success_patterns:
    - "All assertions passed"
    - "PLAY RECAP.*failed=0.*unreachable=0"
    - "successfully"
    - "completed successfully"



# Context extraction settings
context:
  default_before: 5
  default_after: 10
  max_context_lines: 50
  
# Detection sensitivity levels
sensitivity:
  high:
    confidence_threshold: 0.9
    pattern_match_threshold: 0.95
  medium:
    confidence_threshold: 0.7
    pattern_match_threshold: 0.8
  low:
    confidence_threshold: 0.5
    pattern_match_threshold: 0.6 

# Enhanced solution database for hybrid troubleshooting support (ADR-001 Decision #6)
# This section maps error patterns to actionable troubleshooting steps
ansible_solutions:
  # ROSA/OpenShift Administration Issues
  rosa_admin_missing:
    patterns:
      - "cluster admin must be created"
      - "rosa_setup_cluster_admin.*false"
      - "assertion.*cluster.*admin"
    solutions:
      - title: "Create ROSA Cluster Admin User"
        confidence: 0.95
        steps:
          - "rosa create admin --cluster=cluster_name --password"
          - "Save admin credentials securely"
          - "oc login https://api.cluster.com --username cluster-admin"
          - "Verify access: oc whoami && oc get nodes"
        category: "rosa_administration"
        estimated_fix_time: "5-10 minutes"
  # SSH/Connection Issues
  ssh_unreachable:
    patterns: 
      - "UNREACHABLE!"
      - "ssh.*authentication.*failed"
      - "Connection refused"
      - "Failed to connect to the host via ssh"
      - "ssh.*connection.*failed"
    solutions:
      - title: "Verify SSH Key Configuration"
        confidence: 0.9
        steps:
          - "Test SSH connection manually: ssh -i ~/.ssh/key user@host"
          - "Check AWX/AAP credentials for correct SSH key path"
          - "Verify SSH key permissions: chmod 600 ~/.ssh/key"
          - "Ensure SSH key is added to target host authorized_keys"
        category: "ssh_connectivity"
        estimated_fix_time: "5-10 minutes"
      - title: "Network Connectivity Check"
        confidence: 0.8
        steps:
          - "Test network connectivity: ping target_host"
          - "Check firewall rules on both source and target"
          - "Verify SSH service is running: systemctl status sshd"
          - "Check DNS resolution: nslookup target_host"
        category: "network_connectivity"
        estimated_fix_time: "10-15 minutes"

  # Package Management Issues
  package_dependency:
    patterns:
      - "nothing provides.*needed by"
      - "Depsolve Error"
      - "conflicting requests"
      - "dependency.*failed"
      - "No package.*available"
    solutions:
      - title: "Check System Version Compatibility"
        confidence: 0.95
        steps:
          - "Check OS version: cat /etc/os-release"
          - "Verify repository compatibility with OS version"
          - "Use version-specific package repository"
          - "Example: sudo rpm -Uvh https://packages.microsoft.com/config/rhel/8/packages-microsoft-prod.rpm"
        category: "package_management"
        estimated_fix_time: "5-15 minutes"
      - title: "Repository Configuration Check"
        confidence: 0.8
        steps:
          - "List enabled repositories: dnf repolist"
          - "Clean repository cache: dnf clean all"
          - "Rebuild repository metadata: dnf makecache"
          - "Check repository GPG keys: rpm -qa gpg-pubkey*"
        category: "repository_management"
        estimated_fix_time: "10-20 minutes"

  # Permission/Access Issues
  permission_denied:
    patterns:
      - "permission denied"
      - "insufficient.*privilege"
      - "Access.*denied"
      - "Operation not permitted"
      - "Permission refused"
    solutions:
      - title: "Check User Permissions and Sudo Access"
        confidence: 0.9
        steps:
          - "Check current user: whoami"
          - "Verify sudo permissions: sudo -l"
          - "Check file/directory permissions: ls -la target_path"
          - "Review group membership: groups username"
        category: "permissions"
        estimated_fix_time: "5-10 minutes"
      - title: "SELinux/AppArmor Policy Check"
        confidence: 0.7
        steps:
          - "Check SELinux status: sestatus"
          - "Review SELinux denials: ausearch -m AVC -ts recent"
          - "Check AppArmor status: apparmor_status"
          - "Review file contexts: ls -Z target_path"
        category: "security_policy"
        estimated_fix_time: "15-30 minutes"

  # Service/Process Issues
  service_failure:
    patterns:
      - "service.*failed"
      - "systemctl.*failed"
      - "process.*not.*running"
      - "Unit.*failed.*start"
      - "Job.*failed"
    solutions:
      - title: "Service Status and Configuration Check"
        confidence: 0.9
        steps:
          - "Check service status: systemctl status service_name"
          - "View service logs: journalctl -u service_name -n 50"
          - "Check service configuration: systemctl cat service_name"
          - "Verify service dependencies: systemctl list-dependencies service_name"
        category: "service_management"
        estimated_fix_time: "10-20 minutes"
      - title: "System Resources and Health Check"
        confidence: 0.8
        steps:
          - "Check system load: uptime"
          - "Check memory usage: free -h"
          - "Check disk space: df -h"
          - "Review system logs: journalctl -xe"
        category: "system_health"
        estimated_fix_time: "10-15 minutes"

  # File/Directory Issues
  file_not_found:
    patterns:
      - "No such file or directory"
      - "cannot find.*file"
      - "File.*not.*found"
      - "Path.*does not exist"
    solutions:
      - title: "Verify File Path and Existence"
        confidence: 0.9
        steps:
          - "Check if file exists: ls -la full_path"
          - "Search for file in common locations: find / -name filename 2>/dev/null"
          - "Verify working directory: pwd"
          - "Check file permissions and ownership: ls -la dirname/"
        category: "file_system"
        estimated_fix_time: "5-10 minutes"

  # Module/Task Execution Issues
  module_failure:
    patterns:
      - "module.*failed"
      - "task.*failed"
      - "command.*not found"
      - "executable.*not found"
    solutions:
      - title: "Module and Command Availability Check"
        confidence: 0.85
        steps:
          - "Verify command exists: which command_name"
          - "Check PATH environment: echo $PATH"
          - "Install missing package: dnf install package_name"
          - "Verify Ansible module availability: ansible-doc module_name"
        category: "module_execution"
        estimated_fix_time: "10-15 minutes"

  # NEW: Infrastructure correlation solutions
  infrastructure_correlation:
    patterns:
      - "stopped.*name.*stopped"
      - "Ensure EC2 instances are running"
      - "changed:.*item.*state.*stopped"
    solutions:
      - title: "EC2 Instance Restart Impact Analysis"
        confidence: 0.92
        steps:
          - "Wait 2-3 minutes for instance boot completion"
          - "Verify SSH service is running: systemctl status sshd"
          - "Check if SSH keys are properly provisioned post-restart"
          - "Test connectivity: ansible -m ping target_hosts"
          - "Consider adding retry logic for post-restart tasks"
        category: "infrastructure_correlation"
        estimated_fix_time: "5-10 minutes"
        impact: "HIGH - Instance restarts can cause SSH connectivity failures"

  # NEW: Boot sequence intelligence solutions  
  boot_sequence_intelligence:
    patterns:
      - "System is booting up"
      - "Unprivileged users are not permitted to log in yet"
      - "Please come back later"
    solutions:
      - title: "System Boot Completion Wait Strategy"
        confidence: 0.95
        steps:
          - "Implement wait_for module: wait_for port=22 host={{ inventory_hostname }} delay=60"
          - "Add boot completion check: wait_for path=/var/lib/cloud/instance/boot-finished"
          - "Use retries with delay: retries=5 delay=30"
          - "Check system load: uptime and systemctl is-system-running"
        category: "boot_sequence_timing"
        estimated_fix_time: "2-5 minutes"
        impact: "MEDIUM - Boot timing can be resolved with proper wait strategies"

  # NEW: SSH provisioning correlation solutions
  ssh_provisioning_correlation:
    patterns:
      - "no such identity:"
      - "ssh_provision_.*: No such file or directory"
    solutions:
      - title: "SSH Key Provisioning After Instance Restart"
        confidence: 0.90
        steps:
          - "Verify SSH key exists: ls -la ~/.ssh/ssh_provision_*"
          - "Re-run SSH key provisioning: create_ssh_provision_key role"
          - "Check key permissions: chmod 600 ~/.ssh/ssh_provision_*"
          - "Verify key is registered: ssh-add -l"
          - "Test manual connection: ssh -i ~/.ssh/ssh_provision_* user@host"
        category: "ssh_key_provisioning"
        estimated_fix_time: "5-10 minutes"
        impact: "HIGH - SSH key provisioning failures block all remote tasks"

  # NEW: Critical path dependency solutions
  critical_path_dependency:
    patterns:
      - "bastion.*unreachable"
      - ".*unreachable=1.*"
      - "NO MORE HOSTS LEFT"
    solutions:
      - title: "Critical Infrastructure Dependency Failure"
        confidence: 0.98
        steps:
          - "IMMEDIATE: Check bastion host status in cloud console"
          - "Verify bastion security groups allow SSH (port 22)"
          - "Check if bastion public IP has changed"
          - "Test direct bastion connectivity: ssh -i key user@bastion_ip"
          - "If bastion is down, restart instance and wait for boot"
          - "Update inventory with correct bastion IP if changed"
        category: "critical_dependency"
        estimated_fix_time: "10-20 minutes"
        impact: "CRITICAL - Bastion unreachable blocks entire playbook execution"

  # NEW: Infrastructure retry solutions
  infrastructure_retry:
    patterns:
      - "FAILED - RETRYING:.*EC2.*instances.*running"
      - "FAILED - RETRYING:.*Wait until.*EC2"
      - "FAILED - RETRYING:.*instances.*running.*retries left"
    solutions:
      - title: "Infrastructure Retry Pattern Analysis"
        confidence: 0.95
        steps:
          - "Monitor retry frequency - multiple retries indicate infrastructure issues"
          - "Check cloud provider status page for service disruptions"
          - "Verify resource quotas and limits in cloud console"
          - "Review instance types and availability zones for capacity issues"
          - "Consider implementing exponential backoff for retry strategies"
          - "Set up monitoring alerts for retry pattern trends"
        category: "infrastructure_retry"
        estimated_fix_time: "5-15 minutes (monitoring setup)"
        impact: "MEDIUM - Performance degradation and delayed deployments"
        
      - title: "EC2 Instance Provisioning Performance"
        confidence: 0.90
        steps:
          - "Check AWS Service Health Dashboard for EC2 issues"
          - "Verify sufficient capacity in target availability zones"
          - "Consider switching to different instance types if persistent"
          - "Review CloudWatch metrics for EC2 launch times"
          - "Implement retry logic with jitter to avoid thundering herd"
        category: "infrastructure_performance"
        estimated_fix_time: "10-30 minutes"
        impact: "MEDIUM - Infrastructure performance issues affecting automation"

# Solution matching configuration
solution_matching:
  # Use regex matching for patterns
  use_regex: true
  # Minimum confidence threshold for solutions
  min_confidence: 0.6
  # Maximum number of solutions to return
  max_solutions: 3
  # Prefer higher confidence solutions
  sort_by_confidence: true 