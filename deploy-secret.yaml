# LLM Configuration Secret for OpenShift Deployment
# Run this separately to create the secret with your actual values

apiVersion: v1
kind: Secret
metadata:
  name: llm-config-secret
  namespace: mtalvi-alm
  labels:
    app: smart-chunking-engine
type: Opaque
data:
  # Base64 encoded values - replace with your actual encoded credentials
  # To encode: echo -n "your-value" | base64
  
  # Example for OpenAI:
  # api-key: c2stcHJvamVjdC0xMjM0NTY3ODkwYWJjZGVm  # your OpenAI API key
  # model-name: Z3B0LTMuNS10dXJibw==  # gpt-3.5-turbo
  # endpoint-url: aHR0cHM6Ly9hcGkub3BlbmFpLmNvbS92MQ==  # https://api.openai.com/v1
  
  # Example for Azure OpenAI:
  # api-key: eW91ci1henVyZS1rZXk=  # your-azure-key
  # model-name: eW91ci1kZXBsb3ltZW50LW5hbWU=  # your-deployment-name  
  # endpoint-url: aHR0cHM6Ly95b3VyLXJlc291cmNlLm9wZW5haS5henVyZS5jb20v  # https://your-resource.openai.azure.com/
  
  # Example for local model:
  # api-key: ZHVtbXkta2V5  # dummy-key
  # model-name: bGxhbWEyOjdi  # llama2:7b
  # endpoint-url: aHR0cDovL2xvY2FsaG9zdDoxMTQzNC92MQ==  # http://localhost:11434/v1
  
  api-key: ""     # Add your base64 encoded API key here
  model-name: "Z3B0LTMuNS10dXJibw=="     # gpt-3.5-turbo (default)
  endpoint-url: "aHR0cHM6Ly9hcGkub3BlbmFpLmNvbS92MQ=="  # https://api.openai.com/v1 (default) 