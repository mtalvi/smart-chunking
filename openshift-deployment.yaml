# Smart-Chunking Web-based Log Analysis - OpenShift Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-chunking-engine
  namespace: mtalvi-alm
  labels:
    app: smart-chunking-engine
    component: web-analysis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-chunking-engine
  template:
    metadata:
      labels:
        app: smart-chunking-engine
        component: web-analysis
    spec:
      # Handle GPU node taints (your nodes have nvidia.com/gpu=SHARED_L40S:NoSchedule)
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: SHARED_L40S
        effect: NoSchedule
      # Optional: Prefer GPU nodes for better performance
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
      - name: analysis-engine
        image: quay.io/rh-ee-mtalvi/smart-chunking-engine:v2.1.0
        ports:
        - containerPort: 8080
          name: http
        env:
        # System environment
        - name: PYTHONPATH
          value: "/app"
        - name: TRANSFORMERS_CACHE
          value: "/app/.cache/transformers"
        - name: HF_HOME
          value: "/app/.cache/huggingface"
        - name: FLASK_HOST
          value: "0.0.0.0"
        - name: FLASK_PORT
          value: "8080"
        
        # LLM Configuration - Load from secret
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-config-secret
              key: api-key
              optional: false
        - name: MODEL_NAME
          valueFrom:
            secretKeyRef:
              name: llm-config-secret
              key: model-name
              optional: true
        - name: ENDPOINT_URL
          valueFrom:
            secretKeyRef:
              name: llm-config-secret
              key: endpoint-url
              optional: true
        
        resources:
          requests:
            cpu: "1"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
        - name: cache-volume
          mountPath: /app/.cache
        - name: tmp-volume
          mountPath: /tmp
        - name: temp-logs
          mountPath: /app/temp
      volumes:
      - name: config-volume
        configMap:
          name: patterns-config
      - name: cache-volume
        emptyDir:
          sizeLimit: 5Gi
      - name: tmp-volume
        emptyDir:
          sizeLimit: 2Gi
      - name: temp-logs
        emptyDir:
          sizeLimit: 1Gi
---
# Secret for LLM Configuration
apiVersion: v1
kind: Secret
metadata:
  name: llm-config-secret
  namespace: mtalvi-alm
  labels:
    app: smart-chunking-engine
type: Opaque
stringData:
  # Update these values with your actual LLM configuration
  api-key: "your-api-key-here"  # Replace with actual API key
  model-name: "gpt-3.5-turbo"   # Or your preferred model
  endpoint-url: "https://api.openai.com/v1"  # Or your LLM endpoint
---
# Service for Smart-Chunking Engine
apiVersion: v1
kind: Service
metadata:
  name: smart-chunking-service
  namespace: mtalvi-alm
  labels:
    app: smart-chunking-engine
spec:
  selector:
    app: smart-chunking-engine
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
---
# Route for External Access
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: smart-chunking-route
  namespace: mtalvi-alm
  labels:
    app: smart-chunking-engine
  annotations:
    haproxy.router.openshift.io/timeout: "300s"  # 5 minute timeout for analysis
spec:
  to:
    kind: Service
    name: smart-chunking-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None